name: ci

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Assemble and verify all release assets without publishing
        type: boolean
        default: true
      require_all_platforms:
        description: Validate the complete automatic-release platform set in a dry run
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# Build jobs compile third-party source; they only need read access. The
# tag-only release job owns the write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cold dependency builds take a long time; let them finish so the prefix
  # cache is saved even when another main commit arrives.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Bump to invalidate every dependency prefix cache.
  PREFIX_CACHE_VERSION: v2

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Every push to main is a release: MAJOR.MINOR comes from the repo, the patch is the workflow run number.
      # A pushed v* tag releases that exact version. Pull requests and manual runs never release.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "v=$(scripts/stamp-version.sh --base).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            machine: arm64
          - arch: linux-x64
            runner: ubuntu-24.04
            machine: x64
    runs-on: ${{ matrix.runner }}
    # A cold dependency build (Blender build_environment + OIDN + Cycles) can
    # exceed an hour; GitHub-hosted jobs may run up to 6 hours.
    timeout-minutes: 330
    env:
      CC: /usr/bin/gcc-14
      CXX: /usr/bin/g++-14
      LMBLENDER_CC: /usr/bin/gcc-14
      LMBLENDER_CXX: /usr/bin/g++-14
      BLENDER_SOURCE_TREE: ${{ github.workspace }}/build/blender-src-upstream-v5.2.2
      BLENDER_DEPS_ENV_BUILD: ${{ github.workspace }}/build/blender-deps-environment
      BLENDER_DEPS_SOURCE_ROOT: ${{ github.workspace }}/build/blender-deps-environment/build
      BLENDER_DEPS_INSTALL: ${{ github.workspace }}/build/blender-deps-harvest
      BLENDER_LIBDIR: ${{ github.workspace }}/build/blender-deps-harvest
      LMBLENDER_STATIC_PREFIX: ${{ github.workspace }}/build/static-prefix-gcc14
      LMBLENDER_DEPS_BUILD_DIR: ${{ github.workspace }}/build/deps-gcc14
      LMBLENDER_CYCLES_BUILD_DIR: ${{ github.workspace }}/build/cycles-static
      CYCLES_BUILD_DIR: ${{ github.workspace }}/build/cycles-static
      OIDN_SOURCE: ${{ github.workspace }}/build/blender-deps-environment/build/openimagedenoise/src/external_openimagedenoise
      OIDN_BUILD_DIR: ${{ github.workspace }}/build/oidn-static-build
      OIDN_INSTALL_PREFIX: ${{ github.workspace }}/build/oidn-static-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: install build tools and Blender build_environment prerequisites
        id: toolchain
        run: |
          sudo apt-get update -qq
          # Blender build_files/build_environment/cmake/check_software.cmake list,
          # the GCC 14 toolchain used for every static archive, and the X11/GL
          # headers libepoxy's build needs (platform_unix.cmake requires Epoxy).
          # platform_unix.cmake also always requires FreeType (system copy, unlinked).
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gcc-14 g++-14 cmake ninja-build git curl xz-utils patch file \
            autoconf automake autopoint flex help2man gettext texinfo bison libtool yasm nasm tcl \
            meson python3 python3-mako patchelf pkg-config libtinfo-dev libncurses-dev libssl-dev \
            libx11-dev libegl-dev libgl-dev libfreetype-dev
          echo "gcc=$(g++-14 -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          g++-14 --version | head -1
          cmake --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install pinned DSL v5 compiler
        run: npm install --global @lmctl-ai/lmctl@0.2.420
      - name: fetch pinned upstream Blender source (sparse)
        run: scripts/fetch-cycles-source.sh
      # Two cache levels: the full prefix (dependencies + static Cycles) skips
      # every cold step; the dependency prefix alone lets Cycles-only changes
      # skip the ~40 minute build_environment/OIIO/OIDN stage.
      - name: restore static dependency and Cycles prefix
        id: prefix-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/blender-deps-harvest
            build/static-prefix-gcc14
            build/deps-gcc14
            build/oidn-static-install
            build/cycles-static
          key: lmblender-prefix-${{ env.PREFIX_CACHE_VERSION }}-${{ matrix.arch }}-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/cycles-flags.txt', 'scripts/fetch-cycles-source.sh', 'scripts/bootstrap-static-deps.sh', 'scripts/build-deps.sh', 'scripts/build-oidn-static.sh', 'scripts/configure-cycles-static.sh', 'scripts/make-cycles-source-overlay.py', 'patches/*.patch') }}
      - name: restore static dependency prefix (Cycles cache miss only)
        id: deps-cache
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/blender-deps-harvest
            build/static-prefix-gcc14
            build/deps-gcc14
            build/oidn-static-install
          key: lmblender-deps-${{ env.PREFIX_CACHE_VERSION }}-${{ matrix.arch }}-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('scripts/fetch-cycles-source.sh', 'scripts/bootstrap-static-deps.sh', 'scripts/build-deps.sh', 'scripts/build-oidn-static.sh') }}
      - name: restore pinned Blender package sources (cold cache only)
        id: packages-cache
        if: steps.prefix-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/blender-deps-environment/packages
          # Architecture-independent source archives, keyed on the Blender pin.
          key: blender-packages-${{ hashFiles('scripts/fetch-cycles-source.sh') }}
      - name: build pinned Blender dependency sources (cold cache only)
        id: bootstrap
        if: steps.prefix-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: ${{ steps.toolchain.outputs.jobs }}
        run: scripts/bootstrap-static-deps.sh
      - name: check downloaded package sources
        id: packages
        if: always() && steps.bootstrap.outcome != 'skipped' && steps.packages-cache.outputs.cache-hit != 'true'
        run: |
          count=$(find build/blender-deps-environment/packages -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          du -sh build/blender-deps-environment/packages || true
      - name: save pinned Blender package sources
        if: always() && steps.packages.outputs.count > 100
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/blender-deps-environment/packages
          key: blender-packages-${{ hashFiles('scripts/fetch-cycles-source.sh') }}
      - name: build static image dependencies (cold cache only)
        if: steps.prefix-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: ${{ steps.toolchain.outputs.jobs }}
        run: scripts/build-deps.sh
      - name: build static CPU denoiser (cold cache only)
        id: build-oidn
        if: steps.prefix-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: ${{ steps.toolchain.outputs.jobs }}
        run: |
          export ISPC_EXECUTABLE="$(cat build/ispc-executable.txt)"
          scripts/build-oidn-static.sh
          du -sh build/blender-deps-harvest build/static-prefix-gcc14 build/deps-gcc14 build/oidn-static-install
      - name: save static dependency prefix even if later steps fail
        if: always() && steps.build-oidn.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/blender-deps-harvest
            build/static-prefix-gcc14
            build/deps-gcc14
            build/oidn-static-install
          key: lmblender-deps-${{ env.PREFIX_CACHE_VERSION }}-${{ matrix.arch }}-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('scripts/fetch-cycles-source.sh', 'scripts/bootstrap-static-deps.sh', 'scripts/build-deps.sh', 'scripts/build-oidn-static.sh') }}
      - name: build standalone Cycles with pinned source overlay (cold cache only)
        id: build-cycles
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        env:
          BUILD_JOBS: ${{ steps.toolchain.outputs.jobs }}
        run: |
          scripts/configure-cycles-static.sh
          # Keep only what the host link needs in the cached prefix.
          rm -rf build/cycles-static/bin build/cycles-static/CMakeFiles
          du -sh build/cycles-static
      - name: drop dependency build trees before caching
        if: steps.build-cycles.outcome == 'success'
        run: rm -rf build/blender-deps-environment build/oidn-static-build build/oidn-smoke-build
      - name: save static dependency and Cycles prefix even if later checks fail
        if: always() && steps.build-cycles.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/blender-deps-harvest
            build/static-prefix-gcc14
            build/deps-gcc14
            build/oidn-static-install
            build/cycles-static
          key: ${{ steps.prefix-cache.outputs.cache-primary-key }}
      - name: build and test lmblender
        env:
          BUILD_JOBS: ${{ steps.toolchain.outputs.jobs }}
        run: ./test.sh
      - name: assert fully static executable
        run: |
          file build/lmblender
          ldd build/lmblender > build/lmblender.ldd 2>&1 || true
          cat build/lmblender.ldd
          grep -q 'not a dynamic executable' build/lmblender.ldd
          build/lmblender --version
      - name: assert no SVE instructions (arm64 users without SVE would hit SIGILL)
        if: matrix.arch == 'linux-arm64'
        run: scripts/check-no-sve.sh build/lmblender
      - name: stage release assets
        env:
          LMBLENDER_ARCH: ${{ matrix.machine }}
          # Keep the host-facing stable layout inside the ephemeral runner;
          # release.sh otherwise defaults to this developer host's path.
          LMBLENDER_HOST_RELEASE: ${{ github.workspace }}/build/host-release
          TAG_VERSION: ''
        run: |
          VERSION_FILE=$(cat VERSION)
          if [[ -n "$TAG_VERSION" && "${TAG_VERSION#v}" != "$VERSION_FILE" ]]; then
            echo "tag $TAG_VERSION does not match VERSION $VERSION_FILE" >&2
            exit 1
          fi
          FIRST_LINE=$(build/lmblender --version | sed -n '1p')
          BINARY_VERSION=$(sed -n 's/^lmblender \([0-9][^ ]*\) .*/\1/p' <<<"$FIRST_LINE")
          if [[ "$BINARY_VERSION" != "$VERSION_FILE" ]]; then
            echo "binary version $BINARY_VERSION does not match VERSION $VERSION_FILE" >&2
            exit 1
          fi
          RELEASE_VERSION=${TAG_VERSION:-$VERSION_FILE}
          export RELEASE_VERSION
          scripts/release.sh
          # Per-platform names only: the release job merges every job's dist/ into
          # one directory and writes the single SHA256SUMS there (release-checksums.sh).
          cp build/lmblender.ldd "dist/lmblender-linux-${{ matrix.machine }}.ldd"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmblender-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # GPL-3.0 corresponding source: one asset per release with the repository
  # tree, the pinned Blender subset, the patched Cycles overlay, and every
  # hash-verified third-party source archive (scripts/release-source.sh).
  source:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLENDER_SOURCE_TREE: ${{ github.workspace }}/build/blender-src-upstream-v5.2.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: fetch pinned upstream Blender source (sparse)
        run: scripts/fetch-cycles-source.sh
      - name: build the corresponding-source asset
        env:
          TAG_VERSION: ''
        run: |
          VERSION_FILE=$(cat VERSION)
          if [[ -n "$TAG_VERSION" && "${TAG_VERSION#v}" != "$VERSION_FILE" ]]; then
            echo "tag $TAG_VERSION does not match VERSION $VERSION_FILE" >&2
            exit 1
          fi
          RELEASE_VERSION=${TAG_VERSION:-$VERSION_FILE} scripts/release-source.sh
          ls -la dist
          tar -tzf dist/lmblender-source-v*.tar.gz | grep -E '/(SOURCES\.json|upstream/blender-.*-subset\.tar\.gz|upstream/cycles-overlay-patched-.*\.tar\.gz)$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmblender-source
          path: dist/
          if-no-files-found: error

  platforms:
    needs: version
    if: needs.version.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/platforms.yml
    with:
      version: ${{ needs.version.outputs.v }}
      release_run: true

  release:
    if: always() && !cancelled() && needs.build.result == 'success' && needs.source.result == 'success' && (needs.version.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    needs: [version, build, source, platforms]
    runs-on: ubuntu-24.04
    env:
      REL_VERSION: ${{ needs.version.outputs.v }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: test release assembly guards
        run: |
          bash tests/release_assembly_test.sh
          bash tests/release_checksums_test.sh
      # Reusable-workflow uploads belong to this same run. Failed platform jobs
      # never reach upload; filenames are unique across all successful jobs.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmblender-*
          path: dist
          merge-multiple: true
      - name: validate source, platform packages, and one merged SHA256SUMS
        env:
          # Main-push releases must never promote an incomplete Latest. Manual
          # dry runs can opt into this exact gate; tag releases retain tolerance.
          REQUIRE_PLATFORMS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.require_all_platforms) && 'all' || 'linux' }}
          TAG_VERSION: ''
        run: |
          RELEASE_VERSION=${TAG_VERSION:-$(cat VERSION)} scripts/assemble-release.sh dist
          ls -la dist
          cat dist/SHA256SUMS
      - name: upload assembled dry-run release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assembled-release-dist
          path: dist/
          if-no-files-found: error
      - name: publish binaries, archives, checksums, notices, and corresponding source
        if: needs.version.outputs.release == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$REL_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --clobber dist/*
            gh release edit "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$REL_VERSION" --generate-notes --latest dist/*
          fi
